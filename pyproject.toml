[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flappy-fly"
version = "0.1.0"
description = "A frozen fruit-fly connectome playing a one-button game"
requires-python = ">=3.11"
dependencies = ["flybrain==0.1.0", "pygame>=2.6,<3", "numpy>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
flappy-fly = "flappy_fly.cli:main"

[tool.setuptools.packages.find]
include = ["flappy_fly*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["brain: expensive real connectome tests (opt in with RUN_BRAIN_TESTS=1)"]
